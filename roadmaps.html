<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRIET B.Tech Career Roadmap</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="globalstyle.css" />

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="immersive-bg text-slate-200 min-h-screen font-sans overflow-x-hidden">

    <!-- Header -->
<header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
     <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">

            <div class="flex items-center gap-3">
                <div class="bg-indigo-600/20 p-2 rounded-xl text-indigo-400 border border-indigo-500/30">
                    <i data-lucide="graduation-cap" class="w-6 h-6"></i>
                </div>

                <span class="font-bold text-xl tracking-tighter text-slate-800 uppercase italic">
                    GRIET B.Tech Roadmap
                </span>
            </div>

            <nav class="hidden md:flex items-center gap-8">
                <a href="#" class="text-xs font-bold tracking-widest text-slate-300 hover:text-indigo-400 uppercase transition-colors">Home</a>
                <a href="https://www.griet.ac.in/" target="_blank" class="text-xs font-bold tracking-widest text-slate-300 hover:text-indigo-400 uppercase transition-colors">Official Site</a>
            </nav>

        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-12 md:py-16">

        <!-- Intro -->
        <div class="text-center mb-16">

            <div class="inline-block px-3 py-1 rounded-full border border-indigo-500/30 bg-indigo-500/5 text-indigo-400 text-[10px] font-bold tracking-[0.2em] uppercase mb-4">
                Engineering Excellence
            </div>

            <h1 class="text-5xl md:text-6xl font-black text-slate-900 mb-6 tracking-tighter uppercase">
                Bridge to <span class="text-indigo-600">Corporate</span>
            </h1>

            <p class="text-slate-500 max-w-2xl mx-auto text-sm md:text-base tracking-wide leading-relaxed">
                Navigate your 4-year journey at GRIET with precision. Blending academic rigor with industrial skill mastery.
            </p>

        </div>

        <!-- Year Selector -->
        <div id="year-selector" class="flex flex-wrap justify-center gap-3 md:gap-6 mb-20 relative"></div>

        <!-- Roadmap -->
        <div id="roadmap-content" class="transition-opacity duration-300"></div>

        <!-- Button -->
        <div id="next-button-container" class="mt-16 flex justify-center"></div>

    </main>

    <!-- Footer -->
<footer class="border-t border-slate-200 bg-white py-16 mt-20">
        <div class="max-w-7xl mx-auto px-4 grid md:grid-cols-3 gap-16">

            <div class="space-y-6">
                <div class="flex items-center gap-3">
                    <div class="p-2 bg-indigo-500/10 rounded-xl">
                        <i data-lucide="graduation-cap" class="w-8 h-8 text-indigo-500"></i>
                    </div>
                    <span class="font-black text-2xl tracking-tighter text-white uppercase italic">GRIET SCC</span>
                </div>

                <p class="text-slate-600 leading-relaxed text-sm">
                    Crafting student success through intentional skill-building.
                </p>
            </div>

        </div>

    </footer>

    <script src="roadmaps.js"></script>
</body>
</html>
